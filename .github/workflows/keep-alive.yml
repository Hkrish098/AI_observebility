name: Keep Render awake

on:
  schedule:
    # Every 10 minutes. Render's free web service sleeps after about 15 minutes idle.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 120 "https://ai-observebility.onrender.com/health"
